name: Temporary closeout workspace
on:
  push:
    branches: [integration/closeout-20261104]
    paths: [.github/workflows/closeout-workspace.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - name: Reproduce the locally tested integration, without changing main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = ce8a45e6c7d7bc3e8d04ce92ae2529e2c9601e49
          git config user.name 'Cary integration'
          git config user.email '97009482+casama233@users.noreply.github.com'
          git config merge.conflictStyle merge
          mkdir -p "$RUNNER_TEMP/otc-resolve" "$RUNNER_TEMP/otc-results"
          cp .github/closeout/* "$RUNNER_TEMP/otc-resolve/"
          declare -A pins=(
            [15]=dd35841894cf246251f56233ff8134f2384a99c2
            [16]=1cc00c2a5ba686bdf9b1e8755371e1a438269904
            [18]=fc2fccd5b4f7e640ed24f3acf11f450d0be91a79
            [19]=9b2211dd1e94f476a2ec7b8dd8bbc6cfec8d4af4
            [20]=0676e5ee5d064aae44aac5bf7224b290dbdd83ea
            [21]=6cf8ce21cb42d62ed434e6c0b9e3e8c0581ba01c
          )
          for pr in 15 16 18 19 20 21; do
            git fetch --no-tags origin "pull/${pr}/head:refs/remotes/origin/source-pr-${pr}"
            test "$(git rev-parse "origin/source-pr-${pr}")" = "${pins[$pr]}"
          done
          expect_conflicts() {
            if git merge --no-edit "$1"; then
              echo 'Expected the reviewed conflict set; source unexpectedly changed' >&2
              exit 1
            fi
            test -n "$(git diff --name-only --diff-filter=U)"
          }
          git merge --no-edit origin/source-pr-20
          expect_conflicts origin/source-pr-19
          python "$RUNNER_TEMP/otc-resolve/resolve-stove.py"
          git add -A
          git diff --cached --check
          git commit -m 'Integrate food and native kitchen controls with stove timing and recipe ownership'
          expect_conflicts origin/source-pr-21
          python "$RUNNER_TEMP/otc-resolve/resolve-visual.py"
          git add -A
          git diff --cached --check
          git commit -m 'Integrate visual source repairs without regressing native containers or stove controls'
          git merge --no-edit origin/source-pr-16
          expect_conflicts origin/source-pr-15
          git checkout --ours package.json package-lock.json runtime/BP/manifest.json runtime/RP/manifest.json
          git add -A
          git diff --cached --check
          git commit -m 'Retain Java scooter and coin recipes in unique integrated candidate'
          python "$RUNNER_TEMP/otc-resolve/resolve-tests.py"
          mkdir -p docs/validation/0.1.7-alpha.1
          cp "$RUNNER_TEMP/otc-resolve/INTEGRATION.md" docs/validation/0.1.7-alpha.1/INTEGRATION.md
          # Transport data is never decoded or executed and never ships.
          rm -rf .github/closeout .github/closeout-source.b64 .github/workflows/closeout-workspace.yml
          python tools/convert_assets.py
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = 870b512ba1561c5a0488b80cc917c9e20e8a3f01
          git commit -m 'fix: close kitchen integration as 0.1.7-alpha.1 with rollback-safe direct controls'
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/otc-results/source.txt"
      - name: Install exact integrated dependencies and verify actual combined source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run verify 2>&1 | tee "$RUNNER_TEMP/otc-results/verify.log"
          python -m unittest discover -s tests -p 'test_*.py' 2>&1 | tee "$RUNNER_TEMP/otc-results/python.log"
          python tools/check_compliance.py
          python tests/check_release_policy.py
          python tools/convert_assets.py
          git diff --exit-code
          git diff --cached --exit-code
      - name: Fast-forward only the dedicated integration branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = ce8a45e6c7d7bc3e8d04ce92ae2529e2c9601e49
          git push origin HEAD:refs/heads/integration/closeout-20261104
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: otc-integrated-source-checks
          path: ${{ runner.temp }}/otc-results/
          retention-days: 3
# Temporary isolated execution, removed from the resulting tree before checks.
# No main push, force push, release, tag, user world, private input or LIVE operation.
