name: Apply verified appliance source changes
on:
  push:
    branches: [fix/appliance-client-regressions]
    paths: [tools/.appliance-source-edit.diff]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'burnt-tea-dev/order-to-cook-unofficial'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact locally verified source edit and remove temporary tooling
        run: |
          echo '9252506f19c068b98ebd3c32f8e4ac4c3bca291bed8189bfcfda3a7504442293  tools/.appliance-source-edit.diff' | sha256sum --check
          git apply --check tools/.appliance-source-edit.diff
          git apply --index tools/.appliance-source-edit.diff
          git rm tools/.appliance-source-edit.diff .github/workflows/appliance-debug-source.yml
          git diff --cached --check
      - run: npm ci --ignore-scripts
      - run: python -m pip install Pillow==12.3.0
      - run: npm run verify
      - run: python -m unittest discover -s tests -p test_appliance_geometry.py
      - run: python tools/check_compliance.py
      - run: python tests/check_release_policy.py
      - name: Commit verified source only on the unchanged feature branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          current_head="$(git ls-remote origin refs/heads/fix/appliance-client-regressions | cut -f1)"
          test "$current_head" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: bound serialized fridge poses and initialize wash particle direction'
          git push origin HEAD:refs/heads/fix/appliance-client-regressions
