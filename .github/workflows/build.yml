name: Validate and build Bedrock add-on

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Validate attribution, source inventory and packaged legal notices
        run: python tools/check_compliance.py
      - name: Block release tags until upstream asset rights are confirmed
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/check_compliance.py --release
      # Local CI still builds and validates packages for maintainer review.
      # Do not upload Actions artifacts while upstream asset redistribution
      # rights are pending; the repository is not a public download channel.
