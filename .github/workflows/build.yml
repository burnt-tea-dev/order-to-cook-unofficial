name: Validate and build Bedrock add-on

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Check validation scope with real Git changes
        run: python -m unittest discover -s tests -p test_ci_scope.py
      - name: Select validation scope
        id: scope
        run: python tools/ci_scope.py >> "$GITHUB_OUTPUT"
      - run: npm run verify
        if: steps.scope.outputs.full != 'false'
      - name: Build packages for prose-only compliance validation
        if: steps.scope.outputs.full == 'false'
        run: npm run build
      - name: Reproduce appliance, dining and guide assets from pinned editable sources
        if: steps.scope.outputs.full != 'false'
        run: |
          python -m pip install Pillow==12.3.0 numpy==2.3.5
          python -m unittest discover -s tests -p test_appliance_geometry.py
          python -m unittest discover -s tests -p test_dining_assets.py
          python -m unittest discover -s tests -p test_guide_languages.py
      - name: Check segmented model-source prototype against pinned external native geometry
        if: steps.scope.outputs.full != 'false'
        run: |
          curl --fail --silent --show-error --location --max-time 30 https://raw.githubusercontent.com/Mojang/bedrock-samples/15701fa9c13923f12662984c32c124327e40e3d3/resource_pack/models/entity/humanoid.custom.geo.json --output "$RUNNER_TEMP/otc-native-player.geo.json"
          curl --fail --silent --show-error --location --max-time 30 https://raw.githubusercontent.com/Mojang/bedrock-samples/15701fa9c13923f12662984c32c124327e40e3d3/resource_pack/models/mobs.json --output "$RUNNER_TEMP/otc-native-mobs.json"
          OTC_NATIVE_PLAYER_GEOMETRY="$RUNNER_TEMP/otc-native-player.geo.json" OTC_NATIVE_SLIM_GEOMETRY="$RUNNER_TEMP/otc-native-mobs.json" python -m unittest discover -s tests -p test_segmented_player.py
      - name: Validate attribution, source inventory and packaged legal notices
        run: python tools/check_compliance.py
      - name: Regression-check advisory clarification and release tag validation
        run: python tests/check_release_policy.py
      - name: Validate release tag and package requirements
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/check_compliance.py --release
      # Validation does not publish a Release or restore withdrawn downloads.
      # Versioned candidate packaging is handled separately by prepare-candidate.
