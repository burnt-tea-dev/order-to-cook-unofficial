name: Verify menu identity source change
on:
  push:
    branches: [fix/menu-food-identity]
    paths: ['tools/.menu-transfer-*']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'burnt-tea-dev/order-to-cook-unofficial'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hash-verified source edits and remove transfer-only files
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          encoded = ''.join(Path(f'tools/.menu-transfer-{i}').read_text() for i in range(1, 5))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'cce5fe0a2986191bc790c5bce6e283db85c00280443d16f521eb6a041be5fe01'
          Path(os.environ['RUNNER_TEMP'], 'menu.diff').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/menu.diff"
          git apply --index "$RUNNER_TEMP/menu.diff"
          git rm -- .github/workflows/menu-source-apply.yml tools/.menu-transfer-1 tools/.menu-transfer-2 tools/.menu-transfer-3 tools/.menu-transfer-4
          git diff --cached --check
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Retain appliance converter regression coverage
        run: |
          python -m pip install Pillow==12.3.0
          python -m unittest discover -s tests -p test_appliance_geometry.py
      - run: python tools/check_compliance.py
      - run: python tests/check_release_policy.py
      - name: Commit tested source to the unchanged feature branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          current_head="$(git ls-remote origin refs/heads/fix/menu-food-identity | cut -f1)"
          test "$current_head" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: preserve menu food variants through order preparation and delivery'
          git push origin HEAD:refs/heads/fix/menu-food-identity
